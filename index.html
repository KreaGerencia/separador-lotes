<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Separador de Lotes</title>
<meta name="theme-color" content="#1f5fbf">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lotes">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b2430;--mu:#66707d;--bd:#dde1e6;--ac:#1f5fbf;--g:#2e9d57;--y:#e9b100;--r:#d03c3c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1c222b;--tx:#e8ecf1;--mu:#98a2b0;--bd:#2d3541;--ac:#5b9bff;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0}.sub{color:var(--mu);font-size:12px}
main{max-width:980px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:8px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.on{border-color:var(--ac);color:var(--ac);font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}button.ok{background:var(--g);border-color:var(--g);color:#fff}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 3px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px;font-size:13px}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg{width:100%;height:auto;display:block}.lot{cursor:pointer}.lot rect{stroke:rgba(0,0,0,.35);stroke-width:1}.lot:hover rect{stroke:var(--tx);stroke-width:2}
.lot text{pointer-events:none;font-size:13px;font-weight:700;fill:#fff;text-anchor:middle}
.lot.y text{fill:#222}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.md{background:var(--card);width:100%;max-width:460px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.ov{align-items:center}.md{border-radius:16px}}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.kv div{background:var(--bg);padding:8px;border-radius:8px}.kv b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.badge{padding:2px 9px;border-radius:99px;font-size:12px;color:#fff;font-weight:600}.badge.y{color:#222}
.bg-g{background:var(--g)}.bg-y{background:var(--y)}.bg-r{background:var(--r)}
img.rc{width:100%;max-height:300px;object-fit:contain;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.err{color:var(--r);font-size:13px;margin-top:6px}.mu{color:var(--mu)}
.login{max-width:340px;margin:60px auto}
.vp{position:relative;overflow:hidden;height:68vh;min-height:320px;touch-action:none;background:var(--bg);border:1px solid var(--bd);border-radius:10px;cursor:grab;user-select:none}
.st{position:absolute;left:0;top:0;transform-origin:0 0}.st img{display:block;max-width:none;pointer-events:none}
.mk{position:absolute;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mk.y{color:#222}.zb{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}.zb button{width:38px;height:38px;padding:0;font-size:18px}
.st svg{position:absolute;left:0;top:0;pointer-events:none}.lp{pointer-events:auto;cursor:pointer}
.lp polygon{stroke-width:2;vector-effect:non-scaling-stroke;fill-opacity:.4}
.lp.g polygon{fill:var(--g);stroke:var(--g)}.lp.y polygon{fill:var(--y);stroke:var(--y)}.lp.r polygon{fill:var(--r);stroke:var(--r)}
.lp.dr polygon{fill:var(--ac);stroke:var(--ac)}.lp.off polygon{fill:#888;stroke:#888;fill-opacity:.15;stroke-dasharray:5 4}
.lp text{text-anchor:middle;dominant-baseline:central;font-weight:700;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.7);stroke-width:.15em;pointer-events:none}
.lp:hover polygon{fill-opacity:.65}
.lp.inc polygon{stroke-dasharray:6 4}
</style></head><body>
<header><div><h1>🛰️ Separador de Lotes</h1><div class="sub" id="who"></div></div><div id="hr"></div></header>
<main id="app"><p class="mu">Cargando…</p></main>
<div id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ===== Separador de Lotes · PWA con Supabase ===== */
const SB_URL='https://xluwlqmxkgyykxvnidvf.supabase.co',SB_KEY='sb_publishable_TUPwo0QrbOuEXCMSqAgtzg_TBNlP2Xv';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE');
const dt=t=>t?new Date(t).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):'';
const ST={libre:['Libre','g','bg-g'],sep:['En separación','y','bg-y'],separado:['Separado','r','bg-r']};
const ROL={admin:'Administrador',vendedor:'Vendedor',administrativo:'Administrativo',externo:'Visitante'};
const S={me:null,ext:false,projects:[],allLots:[],lots:[],seps:[],share:false,pid:null,tab:'plano',view:null,draft:null};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const mail=d=>d.trim().toLowerCase()+'@separador-lotes.app';
const pos=v=>+v>0;
const complete=l=>!!(String(l.name||'').trim()&&String(l.number||'').trim()&&pos(l.area)&&pos(l.deposit)&&pos(l.priceCash)&&pos(l.priceFin));
const canEditLots=()=>!!S.me&&(S.me.role==='admin'||(S.me.role==='administrativo'&&S.me.canEdit));
const curP=()=>S.projects.find(p=>p.id===S.pid)||null;
const modal=h=>{$('#modal').innerHTML=`<div class="ov" id="ov"><div class="md">${h}</div></div>`;$('#ov').onclick=e=>{if(e.target.id==='ov')closeM()}};
const closeM=()=>$('#modal').innerHTML='';
async function shrink(f,max=4000,q=.85){const im=await createImageBitmap(f),k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return{w,h,blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q))}}
/* --- mapeo de filas --- */
const pUrl=p=>sb.storage.from('planos').getPublicUrl(p).data.publicUrl;
const mProj=r=>({id:r.id,name:r.name,plan:r.plan_path?{url:pUrl(r.plan_path),w:r.plan_w,h:r.plan_h}:null});
const mLot=r=>({id:r.id,projectId:r.project_id,name:r.name,number:r.number,area:r.area,deposit:r.deposit,priceCash:r.price_cash,priceFin:r.price_fin,status:r.status,poly:r.poly});
const mSep=r=>({id:r.id,projectId:r.project_id,lotId:r.lot_id,lotName:r.lot_name,lotNumber:r.lot_number,clientName:r.client_name,clientDni:r.client_dni,finType:r.fin_type,cuotas:r.installments??'Sin Cuotas',receipt:r.receipt_path,sellerName:r.seller_name,status:r.status,createdAt:+new Date(r.created_at),confirmedName:r.confirmed_name,confirmedAt:r.confirmed_at?+new Date(r.confirmed_at):0});
const lastSep=id=>S.seps.filter(s=>s.lotId===id&&s.status!=='anulada').sort((a,b)=>b.createdAt-a.createdAt)[0];
const sorted=()=>[...S.lots].sort((a,b)=>String(a.name).localeCompare(String(b.name))||(parseInt(a.number)||0)-(parseInt(b.number)||0));
const cli=x=>`<div class="kv"><div><b>Cliente</b>${esc(x.clientName)}</div><div><b>DNI del cliente</b>${esc(x.clientDni)}</div><div><b>Tipo de financiamiento</b>${esc(x.finType)}</div><div><b>Cuotas</b>${esc(x.cuotas)}</div></div>`;
/* --- carga y tiempo real --- */
async function load(){
  const q=[sb.from('projects').select('*').order('created_at'),sb.from('lots').select('*'),sb.from('share_settings').select('active').eq('id',1).maybeSingle()];
  if(!S.ext)q.push(sb.from('separations').select('*'));
  const[p,l,sh,sp]=await Promise.all(q);
  S.projects=(p.data||[]).map(mProj);S.allLots=(l.data||[]).map(mLot);S.share=!!(sh.data&&sh.data.active);S.seps=sp?(sp.data||[]).map(mSep):[];
  if(!S.projects.some(x=>x.id===S.pid))S.pid=(S.projects.find(x=>x.id===LS.get('pid'))||S.projects[0]||{}).id||null;
  S.lots=S.allLots.filter(x=>x.projectId===S.pid);render();
}
function live(){const ch=sb.channel('rt');['lots','separations','share_settings','projects'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(S.t);S.t=setTimeout(load,400)}));ch.subscribe()}
/* --- sesión --- */
function loginView(msg){
  $('#who').textContent='';$('#hr').innerHTML='';
  $('#app').innerHTML=`<div class="card login"><h1>Iniciar sesión</h1><label>DNI (administrador: admin)</label><input id="ld" autocomplete="username"><label>Contraseña</label><input id="lp" type="password" autocomplete="current-password"><div class="err" id="le">${esc(msg||'')}</div><button class="p" style="width:100%;margin-top:12px" id="lb">Entrar</button></div>`;
  const go=async()=>{$('#lb').disabled=true;const{error}=await sb.auth.signInWithPassword({email:mail($('#ld').value),password:$('#lp').value});
    if(error){$('#le').textContent='DNI o contraseña incorrectos.';$('#lb').disabled=false;return}await enter()};
  $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function enter(){
  const{data:{user}}=await sb.auth.getUser();const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!p||!p.active){await sb.auth.signOut();loginView('Usuario desactivado o sin perfil. Contacta al administrador.');return}
  S.me={id:p.id,dni:p.dni,name:p.name,role:p.role,canEdit:p.can_edit};await load();live();
}
async function boot(){
  const{data:{session}}=await sb.auth.getSession();
  if(session)return enter();
  if(location.hash==='#ver'){S.ext=true;S.me={role:'externo',name:'Visitante',dni:''};await load();live();return}
  loginView();
}
/* --- estructura --- */
function render(){
  if(!S.me)return;const r=S.me.role;$('#who').textContent=S.me.name+' · '+ROL[r];
  if(S.ext&&!S.share){$('#hr').innerHTML='';$('#app').innerHTML='<div class="card">🔒 El enlace informativo está desactivado.</div>';return}
  $('#hr').innerHTML=r==='externo'?'<a href="#" id="lg" class="sub">Ingresar</a>':'<button id="pw">Mi clave</button> <button id="out">Salir</button>';
  if($('#lg'))$('#lg').onclick=()=>{location.hash='';location.reload()};
  if($('#pw'))$('#pw').onclick=async()=>{const p=prompt('Nueva contraseña (mínimo 6 caracteres)');if(p&&p.length>=6){const{error}=await sb.auth.updateUser({password:p});alert(error?error.message:'Contraseña actualizada')}else if(p)alert('Mínimo 6 caracteres')};
  if($('#out'))$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
  const tabs=[['plano','Plano']];if(r!=='externo')tabs.push(['regs',r==='vendedor'?'Mis separaciones':'Registros']);
  if(r==='admin')tabs.push(['lotes','Lotes'],['users','Usuarios'],['share','Enlace externo']);else if(canEditLots())tabs.push(['lotes','Lotes']);
  if(!tabs.find(t=>t[0]===S.tab))S.tab='plano';
  const adm=r==='admin',pb=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center"><select id="ps" style="width:auto;min-width:170px;font-weight:600">${S.projects.map(p=>`<option value="${p.id}" ${p.id===S.pid?'selected':''}>${esc(p.name)}</option>`).join('')||'<option>Sin proyectos</option>'}</select>${adm?'<button id="pn">+ Proyecto</button>'+(S.pid?'<button id="pr">Renombrar</button><button id="pd">Eliminar</button>':''):''}</div>`;
  $('#app').innerHTML=pb+'<div class="tabs">'+tabs.map(t=>`<button class="${S.tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]}</button>`).join('')+'</div><div id="v"></div>';
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});
  $('#ps').onchange=e=>{S.pid=e.target.value;LS.set('pid',S.pid);S.draft=null;S.view=null;S.tab='plano';S.lots=S.allLots.filter(x=>x.projectId===S.pid);render()};
  if($('#pn'))$('#pn').onclick=async()=>{const n=(prompt('Nombre del nuevo proyecto')||'').trim();if(!n)return;const{data,error}=await sb.from('projects').insert({name:n}).select().single();if(error)return alert(error.message);S.pid=data.id;LS.set('pid',S.pid);S.draft=null;S.view=null;S.tab='plano';load()};
  if($('#pr'))$('#pr').onclick=async()=>{const n=(prompt('Nuevo nombre',curP().name)||'').trim();if(n){await sb.from('projects').update({name:n}).eq('id',S.pid);load()}};
  if($('#pd'))$('#pd').onclick=async()=>{if(confirm(`¿Eliminar «${curP().name}» con sus ${S.lots.length} lotes y registros? No se puede deshacer.`)){const{error}=await sb.from('projects').delete().eq('id',S.pid);if(error)alert(error.message);S.pid=null;S.draft=null;load()}};
  ({plano:vPlano,regs:vRegs,lotes:vLotes,users:vUsers,share:vShare})[S.tab]();
  if(S.tab==='lotes'&&r!=='admin')document.querySelectorAll('[data-f],[data-d]').forEach(b=>b.remove());
}
/* --- ficha del lote --- */
function openLot(id){
  const l=S.lots.find(x=>x.id===id);if(!l)return;const st=ST[l.status],sp=lastSep(id),r=S.me.role;let act='';
  if(r==='vendedor'&&l.status==='libre')act=!complete(l)?'<div class="err" style="font-weight:600;margin:10px 0">⚠️ Datos incompletos: este lote aún no está disponible para separación.</div>':`<div class="row"><div><label>Nombre del cliente</label><input id="cn"></div><div><label>DNI del cliente</label><input id="cd" inputmode="numeric" maxlength="12"></div>
  <div><label>Tipo de financiamiento</label><select id="ft"><option>Al Contado</option><option>En cuotas</option></select></div><div><label>Cuotas</label><input id="cu" value="Sin Cuotas" disabled></div></div>
  <label>Foto del recibo de separación</label><input type="file" id="fl" accept="image/*" capture="environment"><img id="pv" class="rc" style="display:none;margin-top:8px"><div class="err" id="me"></div>
  <button class="p" id="reg" style="width:100%;margin-top:12px" disabled>Registrar Separación</button>`;
  if(sp&&l.status!=='libre'&&r!=='externo')act+=cli(sp)+`<label>Recibo</label><img class="rc" id="rcp"><div class="sub" style="margin-top:6px">Asesor: ${esc(sp.sellerName)} · ${dt(sp.createdAt)}${sp.confirmedName?'<br>Confirmado por '+esc(sp.confirmedName)+' · '+dt(sp.confirmedAt):''}</div>`;
  if(r==='administrativo'&&l.status==='sep'&&sp)act+='<button class="ok" id="cf" style="width:100%;margin-top:12px">Confirmar</button><div class="err" id="me"></div>';
  if(canEditLots())act+='<button id="ed1" style="width:100%;margin-top:10px">Editar datos del lote</button>';
  if(r==='admin'&&l.status!=='libre')act+='<button id="lb1" style="width:100%;margin-top:8px">Liberar lote</button>';
  modal(`<div style="display:flex;justify-content:space-between;align-items:center"><h1>${esc(l.name)} · Lote ${esc(l.number)}</h1><span class="badge ${st[2]} ${st[1]}">${st[0]}</span></div>
  <div class="kv"><div><b>Tamaño</b>${esc(l.area)} m²</div><div><b>Monto de separación</b>${money(l.deposit)}</div><div><b>Precio contado</b>${money(l.priceCash)}</div><div><b>Precio financiado</b>${money(l.priceFin)}</div></div>${act}<button style="width:100%;margin-top:10px" id="cl">Cerrar</button>`);
  $('#cl').onclick=closeM;
  if($('#ed1'))$('#ed1').onclick=()=>editLot(l);
  if($('#lb1'))$('#lb1').onclick=async()=>{if(confirm('¿Liberar este lote y anular su separación?')){const{error}=await sb.rpc('release_lot',{p_lot:l.id});if(error)alert(error.message);closeM();load()}};
  if($('#cf'))$('#cf').onclick=async()=>{const{error}=await sb.rpc('confirm_separation',{p_sep:sp.id});if(error){$('#me').textContent=error.message;return}closeM();load()};
  if($('#rcp'))sb.storage.from('recibos').createSignedUrl(sp.receipt,3600).then(({data})=>{if(data)$('#rcp').src=data.signedUrl});
  if($('#fl'))bindForm(l);
}
function bindForm(l){
  const q=i=>$('#'+i),chk=()=>{const c=q('ft').value==='En cuotas',cu=q('cu');cu.disabled=!c;
    if(!c){cu.type='text';cu.value='Sin Cuotas'}else if(cu.type!=='number'){cu.type='number';cu.value='';cu.min=2;cu.step=1}
    q('reg').disabled=!(q('cn').value.trim()&&/^\d{8,12}$/.test(q('cd').value.trim())&&(!c||(Number.isInteger(+cu.value)&&+cu.value>=2))&&q('fl').files[0])};
  ['cn','cd','ft','cu'].forEach(i=>q(i).oninput=chk);
  q('fl').onchange=()=>{const f=q('fl').files[0];if(f){const p=q('pv');p.src=URL.createObjectURL(f);p.style.display='block'}chk()};
  q('reg').onclick=async()=>{const b=q('reg'),er=q('me'),c=q('ft').value==='En cuotas';b.disabled=true;b.textContent='Guardando…';let path=null;
    try{const{blob}=await shrink(q('fl').files[0],1600,.8);path=`${S.me.id}/${Date.now()}.jpg`;
      let x=await sb.storage.from('recibos').upload(path,blob,{contentType:'image/jpeg'});if(x.error)throw x.error;
      x=await sb.rpc('register_separation',{p_lot:l.id,p_client_name:q('cn').value.trim(),p_client_dni:q('cd').value.trim(),p_fin_type:q('ft').value,p_installments:c?+q('cu').value:null,p_receipt:path});
      if(x.error){await sb.storage.from('recibos').remove([path]);throw x.error}closeM();load()}
    catch(e){er.textContent=e.message||'Error al registrar.';b.disabled=false;b.textContent='Registrar Separación'}};
  chk();
}
function editLot(l){
  const f=[['name','Nombre del lote','text'],['number','Número de lote','text'],['area','Tamaño (m²)','number'],['deposit','Monto de separación (S/.)','number'],['priceCash','Precio contado (S/.)','number'],['priceFin','Precio financiado (S/.)','number']];
  modal(`<h1>Datos del lote</h1><div class="row">${f.map(([k,t,ty])=>`<div><label>${t}</label><input id="e_${k}" type="${ty}" value="${esc(l[k])}"></div>`).join('')}</div><div class="err" id="ee"></div>
  <button class="ok" id="en" style="width:100%;margin-top:12px">Guardar y siguiente lote</button><button class="p" id="es" style="width:100%;margin-top:8px">Guardar</button><button id="ec" style="width:100%;margin-top:8px">Cancelar</button>`);
  $('#ec').onclick=closeM;
  const sv=async nx=>{const v={};f.forEach(([k,,ty])=>{const s=$('#e_'+k).value.trim();v[k]=ty==='number'?(s===''?null:+s):s});
    if(!v.name||!v.number){$('#ee').textContent='Nombre y número son obligatorios.';return}
    const{error}=await sb.from('lots').update({name:v.name,number:v.number,area:v.area,deposit:v.deposit,price_cash:v.priceCash,price_fin:v.priceFin}).eq('id',l.id);
    if(error){$('#ee').textContent=error.message.includes('duplicate')?'Ese nombre y número ya existen.':error.message;return}
    closeM();const L=sorted(),i=L.findIndex(x=>x.id===l.id);await load();if(nx){const L2=sorted();const n=L2[i+1];if(n)editLot(n)}};
  $('#es').onclick=()=>sv(0);$('#en').onclick=()=>sv(1);
}
/* --- guardar plano detectado --- */
async function saveDraft(){
  const D=S.draft;if(S.lots.length&&!confirm(`Esto reemplazará los ${S.lots.length} lotes actuales. ¿Continuar?`))return;

  vp.onpointerdown=e=>{if(e.target.closest('.zb'))return;vp.setPointerCapture(e.pointerId);P.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;dm=document.elementFromPoint(e.clientX,e.clientY)?.closest('.lp')};
  vp.onpointermove=e=>{const p=P.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;

    p.x=e.clientX;p.y=e.clientY;moved+=Math.abs(dx)+Math.abs(dy);tx+=dx;ty+=dy;apply()};

  const c=()=>{const r=vp.getBoundingClientRect();return[r.width/2,r.height/2]};
  $('#zi').onclick=()=>zoomAt(...c(),1.4);$('#zo').onclick=()=>zoomAt(...c(),1/1.4);$('#zf').onclick=fit;
}
