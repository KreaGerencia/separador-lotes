function detectColor(d,samples,tol){
  const{px,w,h}=d,N=w*h,t2=tol*tol,m=new Uint8Array(N);

function parseDni(t){
  const L=t.split(/\n/).map(s=>s.trim()).filter(Boolean),clean=s=>s.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  const BAD=/FECHA|SEXO|ESTADO|NACIM|UBIGEO|DOCUMENTO|DNI|REPUBLICA|PERU|IDENTIDAD|CIVIL|ESTATURA|EMISION|CADUCIDAD|DOMICILIO/;
  const val=i=>{const s=clean(L[i]).replace(/\b(PRIMER|SEGUNDO|APELLIDOS?|PRE|PRENOMBRES?|NOMBRES?)\b/g,'').replace(/\s+/g,' ').trim();if(s.length>=3&&!BAD.test(s))return s;const n=clean(L[i+1]||'');return n.length>=3&&!BAD.test(n)&&!/APELLIDO|NOMBRE/.test(n)?n:''};

}
function parseReceipt(t){

  if(d=t.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/))date=`${d[3]}-${z(d[2])}-${z(d[1])}`;
  else if(d=t.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))date=d[0];

  return{op,date};
}

async function autoAssign(){

  const hs=pol.map(l=>{const ys=l.poly.filter((_,i)=>i%2);return Math.max(...ys)-Math.min(...ys)}).sort((a,b)=>a-b),mh=hs[hs.length>>1]||.05;

/* --- lectura de documentos con modelos --- */
async function loadTess(){if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
async function readByModels(kind,blob){
  const M=(S.ocrModels||[]).filter(m=>m.kind===kind&&m.active&&m.fields.length);if(!M.length)return null;
  await loadTess();const im=await createImageBitmap(blob),w=await Tesseract.createWorker('spa');let best=null;
  try{for(const m of M){const out={};let sc=0;
    for(const f of m.fields){const[x,y,rw,rh]=f.rect,c=document.createElement('canvas'),k=Math.max(1,160/(rh*im.height));c.width=Math.max(8,Math.round(rw*im.width*k));c.height=Math.max(8,Math.round(rh*im.height*k));
      c.getContext('2d').drawImage(im,x*im.width,y*im.height,rw*im.width,rh*im.height,0,0,c.width,c.height);
      await w.setParameters({tessedit_pageseg_mode:'7',tessedit_char_whitelist:['dni','op','date'].includes(f.key)?'0123456789/-. ':''});
      const t=(await w.recognize(c)).data.text.trim().replace(/\s+/g,' ');let v=t;
      if(f.key==='dni'){v=(t.replace(/\s/g,'').match(/\d{8}/)||[''])[0];if(v)sc+=3}
      else if(f.key==='date'){v=parseReceipt(t).date;if(v)sc+=2}
      else if(f.key==='op'){v=t.replace(/[^A-Za-z0-9]/g,'');if(v.length>=5)sc+=2}
      else{v=t.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑ ]/g,'').replace(/\s+/g,' ').trim();if(v.length>=3)sc+=1}
      out[f.key]=v||''}
    if(!best||sc>best.sc)best={sc,out}}}finally{await w.terminate()}
  return best&&best.sc>0?best.out:null;
}

function editModel(M){

      if(error){note=`<div class="note" style="border-color:var(--y)">🔒 ${esc(error.message)}${lk?' · tiempo restante <b id="ltm">--:--</b>':''}</div>`;if(lk)lockUntil=lk.until}
      else{S.lk=id;S.lkUntil=new Date(data);form=true;act=sepForm2()}}
  }else if(lk&&l.status==='libre'&&r!=='externo'){note=`<div class="note" style="border-color:var(--y)">🔒 En proceso de separación por <b>${esc(lk.user_name)}</b> · tiempo restante <b id="ltm">--:--</b></div>`;lockUntil=lk.until}
  if(si&&l.status!=='libre'&&r!=='externo'&&!(sp&&sp.contractUrl))note+=`<div class="sub" style="margin:8px 0">${l.status==='sep'?'En separación por':'Separado por'} <b>${esc(si.seller_name)}</b> · ${dt(si.sep_at)}</div>`;
  if(si&&r!=='externo'){
    if(l.status==='separado'&&si.expires_at)note+=`<div class="sub">⏳ Vence el ${dt(si.expires_at)} · quedan ${fmtLeft(new Date(si.expires_at)-Date.now())}</div>`;
    if(l.status==='sep'&&si.pending_until)note+=`<div class="sub">⏳ Si no se confirma, se libera el ${dt(si.pending_until)} · quedan ${fmtLeft(new Date(si.pending_until)-Date.now())}</div>`}
  const pp=sp&&sp.priceStatus==='pendiente';
  if(sp&&r!=='externo'&&l.status!=='libre'){
    act+=cli(sp)+`<div class="kv"><div><b>Precio (${esc(sp.finType)})</b>${money(sp.priceFinal)}${sp.priceStatus==='aprobado'?' · aprobado':''}</div><div><b>N° de operación</b>${esc(sp.opNumber)}</div><div><b>Fecha de operación</b>${esc(sp.opDate)}</div></div>`;
    if(sp.priceStatus!=='ninguno')act+=`<div class="note">💲 Precio solicitado: <b>${money(sp.priceRequested)}</b> (lista ${money(sp.priceListed)}) · <b>${esc(sp.priceStatus)}</b>${sp.priceNote?' · '+esc(sp.priceNote):''}</div>`;
    if(sp.contractUrl)act+=`<div class="sub">Vendedor: <b>${esc(sp.sellerName)}</b> · Venta confirmada por <b>${esc(sp.soldByName)}</b> · ${dt(sp.soldAt)} · <a href="${esc(sp.contractUrl)}" target="_blank" rel="noopener">Contrato</a></div>`;
    act+=`<label>Documentos y recibo</label><div class="imgs">${[['documentos',sp.dniFront],['documentos',sp.dniBack],['recibos',sp.receipt]].map(([b,p])=>`<img class="dimg" data-b="${b}" data-p="${esc(p)}" onclick="showImg(this.src)">`).join('')}</div>`;
    if(pp&&r!=='vendedor'&&!hasPerm('approve_price'))act+='<div class="note">⏳ Un usuario con permiso debe aprobar o rechazar primero el cambio de precio.</div>';
    if(hasPerm('approve_price')&&pp)act+='<div class="grp" style="margin-top:8px"><button class="ok" id="pa" style="flex:1">Aprobar precio</button><button class="dg" id="pj" style="flex:1">Rechazar precio</button></div>';
    if(r==='administrativo'&&l.status==='sep')act+=`<button class="ok" id="cf" ${pp?'disabled':''} style="width:100%;margin-top:12px">Confirmar separación</button>`+(pp?'<div class="sub">Se habilita cuando el precio sea aprobado o rechazado.</div>':'');
    if(hasPerm('mark_sold')&&l.status==='separado')act+='<label>Enlace del contrato (obligatorio)</label><input id="ct" placeholder="https://…"><button class="p" id="sold" style="width:100%;margin-top:8px">Confirmar venta (Vendido)</button>';
  }
  if(canEditLots())act+='<div class="grp" style="margin-top:12px"><button id="ed1" style="flex:1">✏️ Editar datos</button>'+(l.poly&&l.status==='libre'?'<button id="ua" style="flex:1">Quitar del plano</button>':'')+'</div>';
  if(r==='admin'||r==='administrativo')act+='<button id="lhs" style="width:100%;margin-top:8px">🕘 Historial del lote</button>';
  if(r==='admin'&&l.status!=='libre')act+='<button id="lb1" class="dg" style="width:100%;margin-top:8px">Liberar lote</button>';
  modal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>${esc(l.name)}</h1><span class="badge ${st[2]} ${st[1]}">${st[0]}</span></div>
  <div class="kv"><div><b>Tamaño</b>${esc(l.area)} m²</div><div><b>Monto de separación</b>${money(l.deposit)}</div></div>${note}${act}<div class="err" id="me"></div>${form?'':'<button style="width:100%;margin-top:10px" id="cl">Cerrar</button>'}`);
  const rpc=async(fnm,args)=>{const{error}=await sb.rpc(fnm,args);if(error){$('#me').textContent=error.message;return false}closeM();load();return true};
  if($('#cl'))$('#cl').onclick=()=>closeM();
  if($('#ed1'))$('#ed1').onclick=()=>editLot(l);
  if($('#ua'))$('#ua').onclick=()=>rpc('unassign_lot',{p_lot:l.id});
  if($('#lhs'))$('#lhs').onclick=()=>openLotHistory(l);
  if($('#lb1'))$('#lb1').onclick=()=>{if(confirm('¿Liberar este lote y anular su separación?'))rpc('release_lot',{p_lot:l.id})};
  if($('#cf'))$('#cf').onclick=()=>rpc('confirm_separation',{p_sep:sp.id});
  if($('#pa'))$('#pa').onclick=()=>rpc('resolve_price',{p_sep:sp.id,p_ok:true});if($('#pj'))$('#pj').onclick=()=>rpc('resolve_price',{p_sep:sp.id,p_ok:false});
  if($('#sold'))$('#sold').onclick=()=>{const u=$('#ct').value.trim();if(!/^https?:\/\/.+/i.test(u)){$('#me').textContent='Pega el enlace (http/https) del archivo del contrato.';return}rpc('mark_sold',{p_lot:l.id,p_url:u})};
  document.querySelectorAll('.dimg').forEach(async im=>{const{data}=await sb.storage.from(im.dataset.b).createSignedUrl(im.dataset.p,3600);if(data)im.src=data.signedUrl});
  if(lockUntil)startLockTick(lockUntil);
  if(form)bindForm(l);
}
async function openLotHistory(l){
  const{data,error}=await sb.from('lot_history').select('*').eq('lot_id',l.id).order('at',{ascending:false}).limit(200);
  modal(`<h1>Historial · ${esc(l.name)}</h1>`+(error?`<p class="err">${esc(error.message)}</p>`:(data&&data.length?data.map(h=>`<div class="att" style="align-items:flex-start"><div><b>${esc(h.event)}</b><div class="sub">${esc(h.actor_name||'')}${h.actor_role?' · '+esc(ROL[h.actor_role]||h.actor_role):''}${h.detail?' · '+esc(h.detail):''}</div></div><span class="sub" style="white-space:nowrap">${dt(h.at)}</span></div>`).join(''):'<p class="mu">Sin actividad registrada todavía.</p>'))+'<button style="width:100%;margin-top:12px" id="cl">Volver</button>');
  $('#cl').onclick=()=>openLot(l.id);
}
/* --- limpieza de archivos de separaciones vencidas (administrador) y revisión periódica --- */
async function processPurge(){
  const{data}=await sb.from('purge_queue').select('*').limit(60);if(!data||!data.length)return;
  const by={};data.forEach(r=>(by[r.bucket]=by[r.bucket]||[]).push(r.path));
  for(const[b,ps]of Object.entries(by))await sb.storage.from(b).remove(ps);
  await sb.from('purge_queue').delete().in('id',data.map(r=>r.id));
}
function startPoll(){
  if(S.poll)return;let n=0;
  S.poll=setInterval(async()=>{if(!S.me||S.ext||document.hidden)return;n++;
    await sb.rpc('run_expirations');if(S.me.role==='admin')processPurge();
    const{data}=await sb.from('lot_locks').select('*'),nl={};(data||[]).forEach(k=>{if(new Date(k.until)>new Date())nl[k.lot_id]=k});
    const sig=o=>Object.keys(o).sort().join(',');
    if(sig(nl)!==sig(S.locks||{})||n%3===0)load()},10000);
}
/* --- usuarios: admin delegado, permisos y accesos --- */
function openPerms(u){
  const P=PERMS[u.role]||[];
  modal(`<h1>Permisos de ${esc(u.name)}</h1><p class="sub">${ROL[u.role]}</p>`+(P.length?P.map(p=>`<div class="att"><div><b>${p[1]}</b><div class="sub">${p[2]}</div></div><label class="sw"><input type="checkbox" data-k="${p[0]}" ${(u.perms||[]).includes(p[0])?'checked':''}><span></span></label></div>`).join(''):'<p class="mu">Este rol no tiene permisos configurables.</p>')+'<button style="width:100%;margin-top:12px" id="cl">Volver</button>');
  $('#cl').onclick=()=>openUser(u.id);
  document.querySelectorAll('[data-k]').forEach(c=>c.onchange=async()=>{const s=new Set(u.perms||[]);c.checked?s.add(c.dataset.k):s.delete(c.dataset.k);u.perms=[...s];const{error}=await sb.from('profiles').update({perms:u.perms}).eq('id',u.id);if(error){alert(error.message);openPerms(u)}else toast('Permiso actualizado')});
}
const ROLES_SEL=[['vendedor','Vendedor'],['administrativo','Administrativo'],['admin','Administrador']];
function newUser(){
  formModal('Nuevo usuario',[{id:'nd',label:'DNI *'},{id:'nn',label:'Nombre completo *'},{id:'np',label:'Celular'},{id:'ne',label:'Correo electrónico (para recuperar la contraseña)',type:'email'},{id:'nr',label:'Rol *',select:ROLES_SEL},{id:'nk',label:'Contraseña inicial * (mínimo 6)',pw:1,hint:'Solo sirve para el primer ingreso: el sistema le pedirá cambiarla.'}],async v=>{
    if(!v.nd||!v.nn||!v.nk)return'Completa DNI, nombre y contraseña.';
    try{await fn({action:'create',dni:v.nd,name:v.nn,phone:v.np,email:v.ne,role:v.nr,password:v.nk})}catch(e){return e.message}
    vUsers()},'Crear usuario');
}
async function openUser(id){
  const[{data:u},{data:up}]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),sb.from('user_plans').select('plan_id').eq('user_id',id)]);if(!u)return;
  const adm=u.role==='admin',root=u.dni==='admin',self=u.id===S.me.id,names=(up||[]).map(x=>(S.plans.find(p=>p.id===x.plan_id)||{}).name).filter(Boolean);
  modal(`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1>${esc(u.name)}</h1><span class="badge" style="background:${u.active?'var(--g)':'#9aa4b8'}">${u.active?'Activo':'Inactivo'}</span></div>
  <div class="kv"><div><b>DNI</b>${esc(u.dni)}</div><div><b>Celular</b>${esc(u.phone||'—')}</div><div><b>Rol</b>${ROL[u.role]}</div><div><b>Correo</b>${esc(u.email||'—')}</div></div>
  ${root||self?'':`<div class="att"><div><b>Estado</b><div class="sub">Activa o desactiva el ingreso</div></div><label class="sw"><input type="checkbox" id="stt" ${u.active?'checked':''}><span></span></label></div>`}
  ${adm?'':`<div class="att"><div><b>Acceso a proyectos y planos</b><div class="sub">${u.access_all?'Todos los proyectos y planos':esc(names.join(', ')||'Ninguno seleccionado')}</div></div><button id="uac">Editar acceso</button></div>`}
  <div class="grp" style="margin:14px 0 6px"><button id="ued">✏️ Editar datos</button><button id="ukk">🔑 Cambiar clave</button>${adm?'':'<button id="upm">🛡️ Permisos</button>'}${root||self?'':'<button id="udl" class="dg">🗑 Eliminar</button>'}</div><button style="width:100%;margin-top:6px" id="cl">Cerrar</button>`);
  $('#cl').onclick=()=>{closeM();vUsers()};
  if($('#stt'))$('#stt').onchange=async e=>{const{error}=await sb.from('profiles').update({active:e.target.checked}).eq('id',id);if(error)alert(error.message);openUser(id)};
  if($('#uac'))$('#uac').onclick=()=>openAccess(id);
  $('#ued').onclick=()=>formModal('Editar datos',[{id:'en',label:'Nombre completo',value:u.name},{id:'ep',label:'Celular',value:u.phone||''},{id:'ee',label:'Correo electrónico',type:'email',value:u.email||''}].concat(root||self?[]:[{id:'er',label:'Rol',value:u.role,select:ROLES_SEL}]),async v=>{if(!v.en)return'El nombre es obligatorio.';try{await fn({action:'update_user',id,name:v.en,phone:v.ep,email:v.ee,role:root||self?undefined:v.er})}catch(e){return e.message}openUser(id)});
  $('#ukk').onclick=()=>formModal('Cambiar clave de '+esc(u.name),[{id:'k1',label:'Nueva contraseña (mínimo 6)',pw:1,hint:self?'':'El usuario deberá cambiarla al ingresar.'}],async v=>{if(v.k1.length<6)return'Mínimo 6 caracteres';try{await fn({action:'set_password',id,password:v.k1})}catch(e){return e.message}toast('Contraseña actualizada')});
  if($('#upm'))$('#upm').onclick=()=>openPerms(u);
  if($('#udl'))$('#udl').onclick=async()=>{if(confirm('¿Eliminar a '+u.name+'? No se puede deshacer.'))try{await fn({action:'delete',id});closeM();vUsers()}catch(e){alert(e.message)}};
}
async function openAccess(id){
  const[{data:u},{data:up},{data:pj}]=await Promise.all([sb.from('profiles').select('*').eq('id',id).single(),sb.from('user_plans').select('plan_id').eq('user_id',id),sb.from('user_projects').select('project_id').eq('user_id',id)]);
  const hasL=new Set((up||[]).map(x=>x.plan_id)),hasP=new Set((pj||[]).map(x=>x.project_id)),T='font-size:14px;color:var(--tx);margin:3px 0';
  modal(`<h1>Acceso de ${esc(u.name)}</h1><label style="${T}"><input type="radio" name="am" value="all" ${u.access_all?'checked':''}> Todos los proyectos y planos</label><label style="${T}"><input type="radio" name="am" value="sel" ${u.access_all?'':'checked'}> Seleccionar proyectos y planos</label>
  <div id="al" style="margin-top:10px;${u.access_all?'opacity:.4;pointer-events:none':''}">${S.projects.map(p=>`<div style="margin:10px 0;padding:10px;border:1px solid var(--bd);border-radius:12px"><label style="${T};font-weight:700"><input type="checkbox" data-pj="${p.id}" ${hasP.has(p.id)?'checked':''}> ${esc(p.name)}</label><div style="margin-left:22px">${S.plans.filter(x=>x.projectId===p.id).map(x=>`<label style="${T};font-weight:500"><input type="checkbox" data-pl="${x.id}" data-of="${p.id}" ${hasP.has(p.id)&&hasL.has(x.id)?'checked':''}> ${esc(x.name)}</label>`).join('')||'<div class="sub">Sin planos</div>'}</div></div>`).join('')||'<p class="mu">Aún no hay proyectos.</p>'}</div>
  <p class="sub">Para ver un plano, el usuario necesita acceso al proyecto y al plano. Un proyecto sin planos marcados no se le mostrará.</p><div class="err" id="ae"></div><button class="p" id="as1" style="width:100%;margin-top:12px">Guardar</button><button id="ac1" style="width:100%;margin-top:8px">Cancelar</button>`);
  $('#ac1').onclick=()=>openUser(id);
  document.querySelectorAll('[name=am]').forEach(x=>x.onchange=()=>{const a=document.querySelector('[name=am]:checked').value==='all';$('#al').style.cssText=a?'margin-top:10px;opacity:.4;pointer-events:none':'margin-top:10px'});
  document.querySelectorAll('[data-pj]').forEach(c=>c.onchange=()=>document.querySelectorAll(`[data-of="${c.dataset.pj}"]`).forEach(x=>x.checked=c.checked));
  document.querySelectorAll('[data-pl]').forEach(c=>c.onchange=()=>{if(c.checked)document.querySelector(`[data-pj="${c.dataset.of}"]`).checked=true});
  $('#as1').onclick=async()=>{const all=document.querySelector('[name=am]:checked').value==='all';
    const pls=[...document.querySelectorAll('[data-pl]:checked')].map(x=>({p:x.dataset.of,l:x.dataset.pl})),prs=[...new Set(pls.map(x=>x.p))];
    let x=await sb.from('profiles').update({access_all:all}).eq('id',id);
    if(!x.error)x=await sb.from('user_plans').delete().eq('user_id',id);if(!x.error)x=await sb.from('user_projects').delete().eq('user_id',id);
    if(!x.error&&!all&&pls.length){x=await sb.from('user_projects').insert(prs.map(p=>({user_id:id,project_id:p})));if(!x.error)x=await sb.from('user_plans').insert(pls.map(y=>({user_id:id,plan_id:y.l})))}
    if(x.error){$('#ae').textContent=x.error.message;return}openUser(id)};
}

boot();
</script></body></html>
