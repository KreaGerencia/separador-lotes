<script>
/* ===== Separador de Lotes · PWA con Supabase ===== */
const SB_URL='https://xluwlqmxkgyykxvnidvf.supabase.co',SB_KEY='sb_publishable_TUPwo0QrbOuEXCMSqAgtzg_TBNlP2Xv';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'S/ '+Number(n||0).toLocaleString('es-PE');
const dt=t=>t?new Date(t).toLocaleString('es-PE',{dateStyle:'short',timeStyle:'short'}):'';
const ST={libre:['Libre','g','bg-g'],sep:['En separación','y','bg-y'],separado:['Separado','r','bg-r']};
const ROL={admin:'Administrador',vendedor:'Vendedor',administrativo:'Administrativo',externo:'Visitante'};
const S={me:null,ext:false,projects:[],allLots:[],lots:[],seps:[],share:false,pid:null,tab:'plano',view:null,draft:null};
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const mail=d=>d.trim().toLowerCase()+'@separador-lotes.app';
const pos=v=>+v>0;
const complete=l=>!!(String(l.name||'').trim()&&pos(l.area)&&pos(l.deposit)&&pos(l.priceCash)&&pos(l.priceFin));
const canEditLots=()=>hasPerm('edit_lots');
const curP=()=>S.projects.find(p=>p.id===S.pid)||null;
function closeM(){$('#modal').innerHTML='';clearInterval(S.hb);if(S.lk){sb.rpc('unlock_lot',{p_lot:S.lk});S.lk=null}}
async function shrink(f,max=4000,q=.85){const im=await createImageBitmap(f),k=Math.min(1,max/Math.max(im.width,im.height)),w=Math.round(im.width*k),h=Math.round(im.height*k),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);return{w,h,blob:await new Promise(r=>c.toBlob(r,'image/jpeg',q))}}
/* --- mapeo de filas --- */
const pUrl=p=>sb.storage.from('planos').getPublicUrl(p).data.publicUrl;
const mProj=r=>({id:r.id,name:r.name,share:!!r.share_active,sepDays:r.sep_days,plan:r.plan_path?{url:pUrl(r.plan_path),w:r.plan_w,h:r.plan_h}:null});
const mLot=r=>({id:r.id,projectId:r.project_id,name:r.name,number:r.number,area:r.area,deposit:r.deposit,priceCash:r.price_cash,priceFin:r.price_fin,status:r.status,poly:r.poly,planId:r.plan_id});
const mSep=r=>({id:r.id,projectId:r.project_id,lotId:r.lot_id,lotName:r.lot_name,lotNumber:r.lot_number,amount:r.amount,clientName:r.client_name,clientDni:r.client_dni,finType:r.fin_type,cuotas:r.installments??'Sin Cuotas',receipt:r.receipt_path,sellerName:r.seller_name,status:r.status,createdAt:+new Date(r.created_at),confirmedName:r.confirmed_name,confirmedAt:r.confirmed_at?+new Date(r.confirmed_at):0,opNumber:r.op_number,opDate:r.op_date,priceListed:r.price_listed,priceRequested:r.price_requested,priceStatus:r.price_status,priceNote:r.price_note,contractUrl:r.contract_url,soldByName:r.sold_by_name,expiresAt:r.expires_at?+new Date(r.expires_at):0,dniFront:r.dni_front_path,dniBack:r.dni_back_path});
const lastSep=id=>S.seps.filter(s=>s.lotId===id&&!['anulada','vencida'].includes(s.status)).sort((a,b)=>b.createdAt-a.createdAt)[0];
const sorted=()=>S.lots.filter(l=>l.name).sort((a,b)=>String(a.name).localeCompare(String(b.name),undefined,{numeric:true,sensitivity:'base'}));
const cli=x=>`<div class="kv"><div><b>Cliente</b>${esc(x.clientName)}</div><div><b>DNI del cliente</b>${esc(x.clientDni)}</div><div><b>Tipo de financiamiento</b>${esc(x.finType)}</div><div><b>Cuotas</b>${esc(x.cuotas)}</div></div>`;
/* --- carga y tiempo real --- */
function live(){const ch=sb.channel('rt');['lots','separations','projects','plans','lot_locks','lot_sep_info','notifications'].forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>{clearTimeout(S.t);S.t=setTimeout(load,400)}));ch.subscribe()}
/* --- sesión --- */
function loginView(msg){
  $('#who').textContent='';$('#hr').innerHTML='';
  $('#app').innerHTML=`<div class="card login"><img src="logo.png" alt=""><h1 style="margin:8px 0 2px">Separador de Lotes</h1><p class="sub">Inicia sesión para continuar</p><label>DNI (administrador: admin)</label><input id="ld" autocomplete="username">${pwField('lp','Contraseña')}<div class="err" id="le">${esc(msg||'')}</div><button class="p" style="width:100%;margin-top:12px" id="lb">Entrar</button></div>`;
  const go=async()=>{$('#lb').disabled=true;const{error}=await sb.auth.signInWithPassword({email:mail($('#ld').value),password:$('#lp').value});
    if(error){$('#le').textContent='DNI o contraseña incorrectos.';$('#lb').disabled=false;return}await enter()};
  $('#lb').onclick=go;$('#lp').onkeydown=e=>{if(e.key==='Enter')go()};
}
async function enter(){
  const{data:{user}}=await sb.auth.getUser();const{data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!p||!p.active){await sb.auth.signOut();loginView('Usuario desactivado o sin perfil. Contacta al administrador.');return}
  S.me={id:p.id,dni:p.dni,name:p.name,role:p.role,perms:p.perms||[]};await sb.rpc('expire_separations');await load();live();
}
/* --- estructura --- */
/* --- ficha del lote --- */
function bindForm(l){
  const q=i=>$('#'+i),chk=()=>{const c=q('ft').value==='En cuotas',cu=q('cu');cu.disabled=!c;
    if(!c){cu.type='text';cu.value='Sin Cuotas'}else if(cu.type!=='number'){cu.type='number';cu.value='';cu.min=2;cu.step=1}
    q('reg').disabled=!(q('cn').value.trim()&&/^\d{8,12}$/.test(q('cd').value.trim())&&(!c||(Number.isInteger(+cu.value)&&+cu.value>=2))&&q('fl').files[0])};
  ['cn','cd','ft','cu'].forEach(i=>q(i).oninput=chk);
  q('fl').onchange=()=>{const f=q('fl').files[0];if(f){const p=q('pv');p.src=URL.createObjectURL(f);p.style.display='block'}chk()};
  q('reg').onclick=async()=>{const b=q('reg'),er=q('me'),c=q('ft').value==='En cuotas';b.disabled=true;b.textContent='Guardando…';let path=null;
    try{const{blob}=await shrink(q('fl').files[0],1600,.8);path=`${S.me.id}/${Date.now()}.jpg`;
      let x=await sb.storage.from('recibos').upload(path,blob,{contentType:'image/jpeg'});if(x.error)throw x.error;
      x=await sb.rpc('register_separation',{p_lot:l.id,p_client_name:q('cn').value.trim(),p_client_dni:q('cd').value.trim(),p_fin_type:q('ft').value,p_installments:c?+q('cu').value:null,p_receipt:path});
      if(x.error){await sb.storage.from('recibos').remove([path]);throw x.error}closeM();load()}
    catch(e){er.textContent=e.message||'Error al registrar.';b.disabled=false;b.textContent='Registrar Separación'}};
  chk();
}
/* --- guardar plano detectado --- */
/* --- pestañas --- */
function vRegs(){
  const R=S.seps.filter(s=>s.projectId===S.pid).sort((a,b)=>b.createdAt-a.createdAt);
  if(!R.length){$('#v').innerHTML='<div class="card mu">Sin registros todavía.</div>';return}
  $('#v').innerHTML='<div class="card tw"><table><tr><th>Fecha</th><th>Lote</th><th>Cliente</th><th>Asesor</th><th>Estado</th><th></th></tr>'+R.map(s=>{const c=s.status==='confirmada'?['Confirmada','bg-r']:s.status==='anulada'?['Anulada','']:s.status==='vendida'?['Vendida','bg-b']:s.status==='vencida'?['Vencida','']:['Pendiente','bg-y y'];
    return `<tr><td>${dt(s.createdAt)}</td><td>${esc(s.lotName)}</td><td>${esc(s.clientName)}</td><td>${esc(s.sellerName)}</td><td><span class="badge ${c[1]}">${c[0]}</span></td><td><button data-l="${s.lotId}">${S.me.role==='administrativo'&&s.status==='pendiente'?'Revisar':'Ver'}</button></td></tr>`}).join('')+'</table></div>';
  document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>openLot(b.dataset.l));
}
async function fn(body){const{data,error}=await sb.functions.invoke('admin-users',{body});if(error){let m=error.message;try{m=(await error.context.json()).error||m}catch(e){}throw new Error(m)}if(data&&data.error)throw new Error(data.error);return data}
async function vUsers(){
  const{data}=await sb.from('profiles').select('*').order('created_at'),U=(data||[]).filter(u=>u.role!=='admin');
  $('#v').innerHTML=`<div class="card"><h1>Nuevo usuario</h1><div class="row"><div><label>DNI</label><input id="u1" inputmode="numeric" maxlength="12"></div><div><label>Nombre</label><input id="u2"></div><div><label>Celular</label><input id="u3" inputmode="tel"></div>

async function tplUpload(f){
  try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const nk=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),col=(r,w)=>{const k=Object.keys(r).find(k=>nk(k).includes(w));return k?r[k]:''};
    const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.,-]/g,'').replace(',','.'));return isFinite(n)?n:null};
    const ex=new Map(S.lots.filter(l=>l.name).map(l=>[l.name.toLowerCase(),l])),seen=new Set(),ins=[],upd=[];let skip=0;
    for(const r of rows){const name=String(col(r,'nombre')).trim();if(!name)continue;const k=name.toLowerCase();if(seen.has(k)){skip++;continue}seen.add(k);
      const d={area:num(col(r,'tamano')),deposit:num(col(r,'separacion')),price_cash:num(col(r,'contado')),price_fin:num(col(r,'financiado'))},e=ex.get(k);
      e?upd.push([e.id,d]):ins.push({project_id:S.pid,name,number:name,status:'libre',...d})}
    if(!ins.length&&!upd.length)return alert('No se encontraron filas con datos. Usa la plantilla descargada.');
    if(ins.length){const{error}=await sb.from('lots').insert(ins);if(error)throw error}
    for(const[id,d]of upd){const{error}=await sb.from('lots').update(d).eq('id',id);if(error)throw error}
    alert(`Listo: ${ins.length} nuevos, ${upd.length} actualizados${skip?', '+skip+' repetidos omitidos':''}.`);S.hint=0;load();
  }catch(e){alert('No se pudo leer la plantilla: '+(e.message||e))}
}

/* --- OCR en el navegador (Tesseract.js, se carga solo al usarlo) --- */
async function ocr(blob){
  if(!window.Tesseract)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';s.onload=ok;s.onerror=no;document.head.appendChild(s)});
  const{data}=await Tesseract.recognize(blob,'spa');return data.text;
}
function parseDni(t){
  const L=t.split(/\n/).map(s=>s.trim()).filter(Boolean),clean=s=>s.replace(/[^A-Za-zÁÉÍÓÚÑáéíóúñ ]/g,' ').replace(/\s+/g,' ').trim().toUpperCase();
  const BAD=/FECHA|SEXO|ESTADO|NACIM|UBIGEO|DOCUMENTO|DNI|REPUBLICA|PERU|IDENTIDAD|CIVIL|ESTATURA|EMISION|CADUCIDAD|DOMICILIO/;
  const val=i=>{const s=clean(L[i]).replace(/\b(PRIMER|SEGUNDO|APELLIDOS?|PRE|PRENOMBRES?|NOMBRES?)\b/g,'').replace(/\s+/g,' ').trim();if(s.length>=3&&!BAD.test(s))return s;const n=clean(L[i+1]||'');return n.length>=3&&!BAD.test(n)&&!/APELLIDO|NOMBRE/.test(n)?n:''};
  const ap=[],nm=[];L.forEach((x,i)=>{if(/apellido/i.test(x)){const v=val(i);if(v)ap.push(v)}else if(/nombre/i.test(x)){const v=val(i);if(v)nm.push(v)}});
  return{dni:(t.match(/\b(\d{8})\b/)||[])[1]||'',last:ap.join(' ').trim(),first:nm[0]||''};
}
function parseReceipt(t){
  const m=t.match(/(?:operaci[oó]n|transacci[oó]n|referencia|constancia)\D{0,25}?([A-Z0-9]{5,})/i);let op=m?m[1]:'';
  if(!op){const n=t.match(/\b\d{6,}\b/g);op=n?n.sort((a,b)=>b.length-a.length)[0]:''}
  const MES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,set:9,sep:9,oct:10,nov:11,dic:12},z=n=>String(n).padStart(2,'0');let date='',d;
  if(d=t.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})\b/))date=`${d[3]}-${z(d[2])}-${z(d[1])}`;
  else if(d=t.match(/\b(\d{4})-(\d{2})-(\d{2})\b/))date=d[0];
  else if((d=t.match(/\b(\d{1,2})\s*(?:de\s+)?([a-zA-Z]{3})[a-z]*\.?,?\s*(?:de\s+)?(\d{4})\b/i))&&MES[d[2].toLowerCase()])date=`${d[3]}-${z(MES[d[2].toLowerCase()])}-${z(d[1])}`;
  return{op,date};
}

  const ord=rows.flatMap(r=>r.a.sort((a,b)=>a.c[0]-b.c[0])).map(p=>p.l),n=Math.min(ord.length,rec.length);
  if(!confirm(`Se asociarán ${n} lotes en orden de lectura del plano (de arriba a abajo, de izquierda a derecha). Después puedes corregir cualquiera con «Quitar del plano». ¿Continuar?`))return;
  $('#aq').disabled=true;for(let i=0;i<n;i++){$('#aq').textContent=`${i+1}/${n}…`;const{error}=await sb.rpc('assign_lot',{p_poly:ord[i].id,p_record:rec[i].id});if(error){alert(error.message);break}}load();
}
/* --- guardar plano (con ventana) --- */
function saveDraft(){
  const D=S.draft;
  formModal('Nombre del plano',[{id:'fpn',label:'Nombre del plano',value:`Plano ${curPlans().length+1}`}],async v=>{
    if(!v.fpn)return'Escribe un nombre';
    const path=`${S.pid}-${Date.now()}.jpg`;let x=await sb.storage.from('planos').upload(path,D.blob,{contentType:'image/jpeg'});if(x.error)return x.error.message;
    x=await sb.from('plans').insert({project_id:S.pid,name:v.fpn,plan_path:path,plan_w:D.w,plan_h:D.h}).select().single();if(x.error)return x.error.message;const id=x.data.id;
    x=await sb.from('lots').insert(D.items.filter(i=>!i.off).map(i=>({project_id:S.pid,plan_id:id,status:'libre',poly:i.p})));if(x.error)return x.error.message;
    S.planId=id;LS.set('plan',id);S.draft=null;S.view=null;S.tab='lotes';S.hint=1;load();
  },'Aceptar y guardar');
}
/* --- estructura: panel lateral + cabecera --- */
function renderSide(){
  const r=S.me.role,adm=r==='admin',B=S.brand||{},I=(t,ic,l)=>`<button class="ni ${S.tab===t?'on':''}" data-t="${t}"><span class="ic">${ic}</span>${l}</button>`;
  let h=`<div class="co">${B.logo?`<img src="${B.logo}" alt="">`:''}<div><b>${esc(B.name||'Mi empresa')}</b><div class="sub">${ROL[r]}</div></div></div>`;
  if(r!=='externo'){h+='<div class="nt">Operación</div>'+I('panel','📊','Panel')+I('plano','🗺️','Plano')+I('regs','📋',r==='vendedor'?'Mis separaciones':'Registros');
    if(adm||canEditLots())h+='<div class="nt">Gestión</div>'+I('lotes','🏷️','Lotes');
    if(adm)h+=I('users','👥','Usuarios')+I('perms','🛡️','Permisos')+I('share','🔗','Enlaces externos')+I('hist','🕘','Historial')+I('brand','🎨','Empresa')}
  $('#side').innerHTML=h;
  document.querySelectorAll('#side [data-t]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;document.body.classList.remove('nav-open');render()});
}
function render(){
  if(!S.me)return;const r=S.me.role,adm=r==='admin',ext=r==='externo';
  document.body.classList.toggle('no-side',ext);
  if(!S.navInit){S.navInit=1;if(LS.get('nav_off')==='1')document.body.classList.add('nav-off')}
  $('#who').textContent=S.me.name+' · '+ROL[r];
  if(S.ext&&!S.projects.length){$('#hr').innerHTML='';$('#side').innerHTML='';$('#app').innerHTML='<div class="card" style="text-align:center">🔒 Este enlace informativo no está disponible o fue desactivado.</div>';return}
  const un=(S.notes||[]).filter(n=>!n.read).length;
  $('#hr').innerHTML=ext?'<button id="lg">Ingresar</button>':`<button id="bl" class="bell" title="Avisos">🔔${un?`<span class="cnt">${un}</span>`:''}</button><button id="pw" title="Cambiar mi contraseña">🔑</button><button id="out">Salir</button>`;
  $('#tg').onclick=()=>{if(matchMedia('(max-width:900px)').matches)document.body.classList.toggle('nav-open');else{const o=document.body.classList.toggle('nav-off');LS.set('nav_off',o?'1':'0')}};
  $('#bd').onclick=()=>document.body.classList.remove('nav-open');
  if($('#lg'))$('#lg').onclick=()=>{location.hash='';location.reload()};
  if($('#bl'))$('#bl').onclick=openBell;
  if($('#pw'))$('#pw').onclick=()=>formModal('Cambiar mi contraseña',[{id:'fp1',label:'Nueva contraseña (mínimo 6)',pw:1},{id:'fp2',label:'Repetir contraseña',pw:1}],async v=>{if(v.fp1.length<6)return'Mínimo 6 caracteres';if(v.fp1!==v.fp2)return'Las contraseñas no coinciden';const{error}=await sb.auth.updateUser({password:v.fp1});return error?error.message:null});
  if($('#out'))$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};
  const allowed=ext?['plano']:['panel','plano','regs'].concat(adm?['lotes','users','perms','share','hist','brand']:canEditLots()?['lotes']:[]);
  if(!allowed.includes(S.tab))S.tab='plano';
  renderSide();
  const cpj=curP(),showP=!ext&&['panel','plano','regs','lotes'].includes(S.tab);
  const pb=ext?`<div class="bar"><h1>${esc(cpj.name)}</h1></div>`:showP?`<div class="bar"><select id="ps">${S.projects.map(p=>`<option value="${p.id}" ${p.id===S.pid?'selected':''}>${esc(p.name)}</option>`).join('')||'<option>Sin proyectos</option>'}</select>${adm?'<div class="grp"><button id="bpn">＋ Proyecto</button>'+(cpj?`<button id="bpy">⏱ ${cpj.sepDays?cpj.sepDays+' días':'Sin límite'}</button><button id="bpr">Renombrar</button><button id="bpd" class="dg">Eliminar</button>`:'')+'</div>':''}</div>`:'';
  $('#app').innerHTML=pb+'<div id="v"></div>';
  const reload=()=>{S.draft=null;S.view=null;S.planId=null;load()};
  if($('#ps'))$('#ps').onchange=e=>{S.pid=e.target.value;LS.set('pid',S.pid);S.draft=null;S.view=null;S.planId=null;load()};
  if($('#bpn'))$('#bpn').onclick=()=>formModal('Nuevo proyecto',[{id:'fnm',label:'Nombre del proyecto'}],async v=>{if(!v.fnm)return'Escribe un nombre';const{data,error}=await sb.from('projects').insert({name:v.fnm}).select().single();if(error)return error.message;S.pid=data.id;LS.set('pid',S.pid);S.tab='plano';reload()});
  if($('#bpr'))$('#bpr').onclick=()=>formModal('Renombrar proyecto',[{id:'fnm',label:'Nombre del proyecto',value:cpj.name}],async v=>{if(!v.fnm)return'Escribe un nombre';const{error}=await sb.from('projects').update({name:v.fnm}).eq('id',S.pid);if(error)return error.message;load()});
  if($('#bpy'))$('#bpy').onclick=()=>formModal('Días en estado «Separado»',[{id:'fdy',label:'Días antes de liberar el lote (vacío = sin límite)',type:'number',value:cpj.sepDays||''}],async v=>{const n=v.fdy===''?null:parseInt(v.fdy);if(n!==null&&!(n>0))return'Número inválido';const{error}=await sb.from('projects').update({sep_days:n}).eq('id',S.pid);if(error)return error.message;load()});
  if($('#bpd'))$('#bpd').onclick=async()=>{if(confirm(`¿Eliminar «${cpj.name}» con sus planos, lotes y registros? No se puede deshacer.`)){const{error}=await sb.from('projects').delete().eq('id',S.pid);if(error)alert(error.message);S.pid=null;reload()}};
  ({panel:vPanel,plano:vPlano,regs:vRegs,lotes:vLotes,users:vUsers,perms:vPerms,share:vShare,hist:vHist,brand:vBrand})[S.tab]();
}

boot();
</script></body></html>
