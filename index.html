/* ===== v4: detección por color a partir de muestras ===== */
function detectColor(d,samples,tol){
  const{px,w,h}=d,N=w*h,t2=tol*tol,m=new Uint8Array(N);
  for(let i=0;i<N;i++){const o=i*4;for(const s of samples){const a=px[o]-s[0],b=px[o+1]-s[1],c=px[o+2]-s[2];if(a*a+b*b+c*c<=t2){m[i]=1;break}}}
  const lab=new Int32Array(N),st=new Int32Array(N),cs=[];
  for(let s=0;s<N;s++){if(!m[s]||lab[s])continue;const id=cs.length+1;let sp=0,a=0,x0=w,x1=0,y0=h,y1=0,sx=0,sy=0,bd=0;st[sp++]=s;lab[s]=id;
    while(sp){const p=st[--sp],x=p%w,y=(p-x)/w;a++;sx+=x;sy+=y;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;if(!x||!y||x===w-1||y===h-1)bd=1;
      if(x>0&&m[p-1]&&!lab[p-1]){lab[p-1]=id;st[sp++]=p-1}if(x<w-1&&m[p+1]&&!lab[p+1]){lab[p+1]=id;st[sp++]=p+1}
      if(y>0&&m[p-w]&&!lab[p-w]){lab[p-w]=id;st[sp++]=p-w}if(y<h-1&&m[p+w]&&!lab[p+w]){lab[p+w]=id;st[sp++]=p+w}}
    cs.push({id,a,x0,x1,y0,y1,cx:sx/a,cy:sy/a,bd,pts:[]})}
  let c=cs.filter(c=>{const bw=c.x1-c.x0+1,bh=c.y1-c.y0+1;return !c.bd&&c.a>=N*.0002&&Math.max(bw,bh)/Math.min(bw,bh)<=8});
  if(!c.length)return[];
  const ar=c.map(x=>x.a).sort((a,b)=>a-b),med=ar[ar.length>>1];c=c.filter(x=>x.a>=med*.3&&x.a<=med*3.5);
  const by={};c.forEach(x=>by[x.id]=x);

  if($('#lb1'))$('#lb1').onclick=async()=>{if(confirm('¿Liberar este lote y anular su separación?')){const{error}=await sb.rpc('release_lot',{p_lot:l.id});if(error)alert(error.message);closeM();load()}};
  if($('#cf'))$('#cf').onclick=async()=>{const{error}=await sb.rpc('confirm_separation',{p_sep:sp.id});if(error){$('#me').textContent=error.message;return}closeM();load()};
  if($('#rcp'))sb.storage.from('recibos').createSignedUrl(sp.receipt,3600).then(({data})=>{if(data)$('#rcp').src=data.signedUrl});
  if($('#fl'))bindForm(l);
}
function openFree(l){
  const free=S.lots.filter(x=>x.name&&!x.poly).sort((a,b)=>nat(a.name,b.name)),ed=canEditLots();
  modal(`<h1>Posible lote</h1><p class="sub">Marca del plano sin asociar a un lote registrado.</p>`+(ed?(free.length?`<label>Lote registrado (${free.length} disponibles)</label><select id="as"><option value="">Elige un lote…</option>${free.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.area??'')} m²</option>`).join('')}</select><div class="err" id="ae"></div><button class="p" id="ab" style="width:100%;margin-top:12px" disabled>Asociar a este lote del plano</button>`:'<div class="note">No hay lotes registrados pendientes. En <b>Lotes</b> descarga la plantilla, llénala y súbela.</div>'):'<div class="note">Este lote aún no tiene datos.</div>')+'<button style="width:100%;margin-top:10px" id="cl">Cerrar</button>');
  $('#cl').onclick=closeM;
  if($('#as')){$('#as').onchange=()=>$('#ab').disabled=!$('#as').value;$('#ab').onclick=async()=>{$('#ab').disabled=true;const{error}=await sb.rpc('assign_lot',{p_poly:l.id,p_record:$('#as').value});if(error){$('#ae').textContent=error.message;$('#ab').disabled=false;return}closeM();load()}}
}
function editLot(l){
  const f=[['name','Nombre del lote','text'],['area','Tamaño (m²)','number'],['deposit','Monto de separación (S/.)','number'],['priceCash','Precio contado (S/.)','number'],['priceFin','Precio financiado (S/.)','number']];
  modal(`<h1>Datos del lote</h1><div class="row">${f.map(([k,t,ty])=>`<div><label>${t}</label><input id="e_${k}" type="${ty}" ${ty==='number'?'inputmode="decimal" step="any"':''} value="${esc(l[k])}"></div>`).join('')}</div><div class="err" id="ee"></div>
  <button class="ok" id="en" style="width:100%;margin-top:12px">Guardar y siguiente lote</button><button class="p" id="es" style="width:100%;margin-top:8px">Guardar</button><button id="ec" style="width:100%;margin-top:8px">Cancelar</button>`);
  $('#ec').onclick=closeM;
  const sv=async nx=>{const v={};f.forEach(([k,,ty])=>{const s=$('#e_'+k).value.trim();v[k]=ty==='number'?(s===''?null:+s):s});
    if(!v.name){$('#ee').textContent='El nombre del lote es obligatorio.';return}
    const{error}=await sb.from('lots').update({name:v.name,number:v.name,area:v.area,deposit:v.deposit,price_cash:v.priceCash,price_fin:v.priceFin}).eq('id',l.id);
    if(error){$('#ee').textContent=error.message.includes('duplicate')?'Ya existe un lote con ese nombre.':error.message;return}
    closeM();const i=sorted().findIndex(x=>x.id===l.id);await load();if(nx){const n=sorted()[i+1];if(n)editLot(n)}};
  $('#es').onclick=()=>sv(0);$('#en').onclick=()=>sv(1);
}
async function saveDraft(){
  const D=S.draft,np=S.lots.filter(l=>l.poly).length;
  if(np&&!confirm(`Se reemplazarán las ${np} marcas actuales del plano. Los datos de lotes ya registrados se conservan, pero tendrás que volver a asociarlos. ¿Continuar?`))return;
  $('#sv').disabled=true;$('#sv').textContent='Guardando…';
  try{const path=`${S.pid}-${Date.now()}.jpg`;let x=await sb.storage.from('planos').upload(path,D.blob,{contentType:'image/jpeg'});if(x.error)throw x.error;
    x=await sb.from('lots').delete().eq('project_id',S.pid).is('name',null);if(x.error)throw x.error;
    x=await sb.from('lots').update({poly:null}).eq('project_id',S.pid).not('poly','is',null);if(x.error)throw x.error;
    x=await sb.from('projects').update({plan_path:path,plan_w:D.w,plan_h:D.h}).eq('id',S.pid);if(x.error)throw x.error;
    x=await sb.from('lots').insert(D.items.filter(i=>!i.off).map(i=>({project_id:S.pid,status:'libre',poly:i.p})));if(x.error)throw x.error;
    S.draft=null;S.view=null;S.tab='lotes';S.hint=1;await load();
  }catch(e){alert('Error: '+(e.message||e));$('#sv').disabled=false;$('#sv').textContent='Guardar como posibles lotes'}
}
const TPL=['Nombre del Lote','Tamaño (m2)','Monto de Separación (S/.)','Precio Contado (S/.)','Precio Financiado (S/.)'];
function tplDownload(){
  const wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet([TPL]);ws['!cols']=[{wch:22},{wch:14},{wch:26},{wch:22},{wch:24}];XLSX.utils.book_append_sheet(wb,ws,'Lotes');
  const ins=XLSX.utils.aoa_to_sheet([['Instrucciones'],['1. Llena una fila por lote en la hoja «Lotes». No cambies los títulos de las columnas.'],['2. «Nombre del Lote» es lo que verá el vendedor en el plano (ejemplo: A-01). No se puede repetir.'],['3. Los demás campos son números sin símbolos (ejemplo: 140, 1000, 45000, 52000).'],['4. Si subes un nombre que ya existe, se actualizan sus datos.'],['5. Guarda el archivo y súbelo con «Subir plantilla».']]);ins['!cols']=[{wch:100}];XLSX.utils.book_append_sheet(wb,ins,'Instrucciones');
  XLSX.writeFile(wb,'plantilla-lotes.xlsx');
}
async function tplUpload(f){
  try{const wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
    const nk=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''),col=(r,w)=>{const k=Object.keys(r).find(k=>nk(k).includes(w));return k?r[k]:''};
    const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.,-]/g,'').replace(',','.'));return isFinite(n)?n:null};
    const ex=new Map(S.lots.filter(l=>l.name).map(l=>[l.name.toLowerCase(),l])),seen=new Set(),ins=[],upd=[];let skip=0;
    for(const r of rows){const name=String(col(r,'nombre')).trim();if(!name)continue;const k=name.toLowerCase();if(seen.has(k)){skip++;continue}seen.add(k);
      const d={area:num(col(r,'tamano')),deposit:num(col(r,'separacion')),price_cash:num(col(r,'contado')),price_fin:num(col(r,'financiado'))},e=ex.get(k);
      e?upd.push([e.id,d]):ins.push({project_id:S.pid,name,number:name,status:'libre',...d})}
    if(!ins.length&&!upd.length)return alert('No se encontraron filas con datos. Usa la plantilla descargada.');
    if(ins.length){const{error}=await sb.from('lots').insert(ins);if(error)throw error}
    for(const[id,d]of upd){const{error}=await sb.from('lots').update(d).eq('id',id);if(error)throw error}
    alert(`Listo: ${ins.length} nuevos, ${upd.length} actualizados${skip?', '+skip+' repetidos omitidos':''}.`);S.hint=0;load();
  }catch(e){alert('No se pudo leer la plantilla: '+(e.message||e))}
}
function vLotes(){
  const L=sorted(),adm=S.me.role==='admin',un=S.lots.filter(l=>l.poly&&!l.name).length;
  $('#v').innerHTML=(S.hint?'<div class="note" style="margin-top:0">✅ Posibles lotes guardados. <b>Siguiente:</b> descarga la plantilla, llénala y súbela. Luego, en <b>Plano</b>, asocia cada marca con su lote.</div>':'')+
  `<div class="card"><div class="bar" style="margin:0 0 8px"><div><h1>Lotes registrados</h1><div class="sub">${L.length} lotes · ${un} posibles lotes sin asignar en el plano</div></div>${adm?'<div class="grp" style="margin-left:auto"><button id="td">⬇ Descargar plantilla</button><label class="btn p">⬆ Subir plantilla<input type="file" id="tu" accept=".xlsx,.xls,.csv" hidden></label></div>':''}</div>`+
  (L.length?`<div class="tw"><table><tr><th>Lote</th><th>m²</th><th>Separación</th><th>Contado</th><th>Financiado</th><th>Plano</th><th>Estado</th><th></th></tr>`+L.map(l=>`<tr><td><b>${esc(l.name)}</b></td><td>${esc(l.area??'')}</td><td>${money(l.deposit)}</td><td>${money(l.priceCash)}</td><td>${money(l.priceFin)}</td><td>${l.poly?'✔':'<span class="mu">Sin ubicar</span>'}</td><td>${ST[l.status][0]}${complete(l)?'':' <span class="err">· Datos incompletos</span>'}</td>
  <td><button data-e="${l.id}">Editar</button>${adm?` <button data-d="${l.id}" class="dg">Borrar</button>`:''}</td></tr>`).join('')+'</table></div>':'<p class="mu">Aún no hay lotes registrados.</p>')+'</div>';
  if($('#td'))$('#td').onclick=tplDownload;if($('#tu'))$('#tu').onchange=e=>{if(e.target.files[0])tplUpload(e.target.files[0])};
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>editLot(S.lots.find(l=>l.id===b.dataset.e)));
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{if(confirm('¿Borrar este lote?')){const{error}=await sb.from('lots').delete().eq('id',b.dataset.d);if(error)alert(error.message);load()}});
}
function vShare(){
  $('#v').innerHTML=`<div class="card"><h1>Enlaces informativos por proyecto</h1><p class="sub">Cada proyecto tiene su propio enlace. Cualquier persona con el enlace activo ve el plano y la ficha de los lotes (tamaño, precios, monto de separación y estado), <b>sin cuenta</b>. No ve clientes ni recibos y no puede cambiar nada.</p>
  <div class="tw"><table><tr><th>Proyecto</th><th>Estado</th><th>Enlace</th><th></th></tr>${S.projects.map(p=>{const u=location.origin+location.pathname+'#ver='+p.id;return `<tr><td><b>${esc(p.name)}</b></td><td>${p.share?'✅ Activo':'⛔ Inactivo'}</td><td><input readonly value="${u}" onclick="this.select()" style="min-width:260px"></td><td><button data-s="${p.id}" class="${p.share?'':'ok'}">${p.share?'Desactivar':'Activar'}</button> <button data-k="${u}">Copiar</button></td></tr>`}).join('')}</table></div></div>`;
  document.querySelectorAll('[data-s]').forEach(b=>b.onclick=async()=>{const p=S.projects.find(x=>x.id===b.dataset.s),{error}=await sb.from('projects').update({share_active:!p.share}).eq('id',p.id);if(error)alert(error.message);load()});
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.k);b.textContent='¡Copiado!'}catch(e){alert(b.dataset.k)}});
}

boot();
</script></body></html>
